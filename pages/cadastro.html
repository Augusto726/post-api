<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>API Jogos</title>
    <link rel="stylesheet" href="../css/cadastro.css">
    <script src="../js/post.js" defer></script>
</head>
<body>
    <header>
        <section id="header-texto">
            <small id="p-header"><b>aqui você pode cadastrar seus jogos</b></small>
            <h1 class="uppercase">cadastre seus <span class="rosa">jogos</span> favoritos <span id="rosa">aqui!</span></h1>
            <p>Prática com método GET: buscar e exibir jogos da API do Codeverse</p>
            <a href="../index.html">Ir para a vizualização dos jogos</a>
        </section>
    </header>
    <main>
        <form id="form-jogo">
            <legend>Cadastre seu jogo</legend>

            <label for="titulo">Nome do jogo:</label>
            <input type="text" name="titulo" id="titulo" required>

            <label for="genero">Gênero do jogo:</label>
            <input type="text" name="genero" id="genero" required>

            <label for="plataforma">Plataforma:</label>
            <input type="text" name="plataforma" id="plataforma" required> 

            <label for="ano_lancamento">Ano de Lançamento:</label>
            <input type="text" name="ano_lancamento" id="ano_lancamento" required> 
            
            <label for="desenvolvedora">Desenvolvedora:</label>
            <input type="text" name="desenvolvedora" id="desenvolvedora" required> 

            <label for="imagem">URL da imagem:</label>
            <input type="text" name="imagem" id="imagem">

            <button type="submit" id="resposta">Clique aqui para enviar os dados</button>
        </form>
    </main>
</body>
</html>
